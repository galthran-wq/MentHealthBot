services:
  postgres:
    container_name: postgres
    image: postgres:14
    environment:
      POSTGRES_DB: "mental_db"
      POSTGRES_USER: "mental_user"
      POSTGRES_PASSWORD: "password"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - postgres
    restart: always
    ports:
    - "55432:5432"

  client-bot:
    build: ./client-bot
    restart: always
    depends_on:
      - postgres
    networks:
      - postgres
      - bot

  admin_bot:
    build: ./admin-bot
    restart: always
    depends_on:
      - postgres
    networks:
      - postgres
      - bot

networks:
  postgres:
    driver: bridge
  bot:
    driver: bridge
  
